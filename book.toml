[book]
title = "sim — Simulation, ROS2 & Robot Learning"
description = "Simulation/digital-twin engineering: ROS2, Gazebo, MuJoCo, Isaac Lab, RL, VR/AR teleoperation."
authors = ["Kourosh"]
language = "en"
src = "pages"

[build]
create-missing = false

[output.html]
git-repository-url = "https://github.com/Kooroshoo/sim"
edit-url-template = "https://github.com/Kooroshoo/sim/edit/main/{path}"
site-url = "/sim/"
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["custom.css"]
curly-quotes = true

[output.html.fold]
enable = true
level = 1

[output.html.playground]
runnable = false
copyable = true
